[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ternary-sd"
version = "0.1.0"
description = "Ternary quantization for Stable Diffusion models"
authors = [
    {name = "Your Name", email = "your.email@example.com"},
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "diffusers>=0.21.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
    "safetensors>=0.3.0",
    "pillow>=9.0.0",
    "opencv-python>=4.5.0",
    "pytest>=7.0.0",
    "memory-profiler>=0.61.0",
]
requires-python = ">=3.8"
readme = "README.md"

[project.optional-dependencies]
dev = ["black", "flake8", "mypy"]

[tool.setuptools]
packages = ["models", "diffusion", "utils", "examples", "scripts", "checkpoints", "tests"]